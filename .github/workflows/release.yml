name: Production Release

on:
  release:
    types:
      - published

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test Wheel Installation
        run: |
          python -m venv test-env-wheel
          test-env-wheel/bin/pip install dist/*.whl
          test-env-wheel/bin/django-start --help
          test-env-wheel/bin/django-version --help
          test-env-wheel/bin/python -c "import djstartlib"
          test-env-wheel/bin/python -c "import django_start"
          WHEEL_VER=$(test-env-wheel/bin/python -c "import importlib.metadata; print(importlib.metadata.version('django-start-automate'))")
          echo "Installed wheel version: $WHEEL_VER"
          echo "WHEEL_VER=$WHEEL_VER" >> $GITHUB_ENV

      - name: Test SDist Installation
        run: |
          python -m venv test-env-sdist
          test-env-sdist/bin/pip install dist/*.tar.gz
          test-env-sdist/bin/django-start --help
          test-env-sdist/bin/django-version --help
          test-env-sdist/bin/python -c "import djstartlib"
          test-env-sdist/bin/python -c "import django_start"
          SDIST_VER=$(test-env-sdist/bin/python -c "import importlib.metadata; print(importlib.metadata.version('django-start-automate'))")
          echo "Installed sdist version: $SDIST_VER"
          echo "SDIST_VER=$SDIST_VER" >> $GITHUB_ENV

      - name: Verify Version Consistency
        run: |
          TAG_VERSION=${{ github.event.release.tag_name }}
          # Normalize optional leading 'v'
          TAG_VERSION=${TAG_VERSION#v}
          echo "Release tag version: $TAG_VERSION"
          echo "Wheel version: ${{ env.WHEEL_VER }}"
          echo "SDist version: ${{ env.SDIST_VER }}"

          if [ "$TAG_VERSION" != "${{ env.WHEEL_VER }}" ]; then
            echo "Error: Release tag version ($TAG_VERSION) does not match wheel version (${{ env.WHEEL_VER }})"
            exit 1
          fi
          if [ "$TAG_VERSION" != "${{ env.SDIST_VER }}" ]; then
            echo "Error: Release tag version ($TAG_VERSION) does not match sdist version (${{ env.SDIST_VER }})"
            exit 1
          fi

      - name: Prepare Release Bundle
        run: |
          mkdir -p release/packages
          mkdir -p release/evidence
          cp dist/* release/packages/
          cd release/packages
          sha256sum * > ../evidence/SHA256SUMS
          cat ../evidence/SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: release/
          if-no-files-found: error

  publish:
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: pypi
    concurrency:
      group: pypi-production-release
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: release/

      - name: Verify Hashes
        run: |
          cd release/packages
          sha256sum -c ../evidence/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release/packages/
          skip-existing: false
