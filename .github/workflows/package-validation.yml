name: Package Validation

on:
  pull_request:
    paths:
      - 'setup.cfg'
      - 'setup.py'
      - 'pyproject.toml'
      - 'djstartlib/**'
      - 'README.md'
      - 'LICENSE'
      - 'MANIFEST.in'
      - '.github/workflows/package-validation.yml'
      - '.github/workflows/release.yml'
  push:
    branches:
      - main
    paths:
      - 'setup.cfg'
      - 'setup.py'
      - 'pyproject.toml'
      - 'djstartlib/**'
      - 'README.md'
      - 'LICENSE'
      - 'MANIFEST.in'
      - '.github/workflows/package-validation.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: setup.cfg

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Test Wheel Installation
        run: |
          python -m venv test-env-wheel
          test-env-wheel/bin/pip install dist/*.whl
          test-env-wheel/bin/django-start --help
          test-env-wheel/bin/django-version --help
          test-env-wheel/bin/python -c "import djstartlib"
          WHEEL_VER=$(test-env-wheel/bin/python -c "import importlib.metadata; print(importlib.metadata.version('django-start-automate'))")
          echo "Installed wheel version: $WHEEL_VER"
          echo "WHEEL_VER=$WHEEL_VER" >> $GITHUB_ENV

      - name: Test SDist Installation
        run: |
          python -m venv test-env-sdist
          test-env-sdist/bin/pip install dist/*.tar.gz
          test-env-sdist/bin/django-start --help
          test-env-sdist/bin/python -c "import djstartlib"
          SDIST_VER=$(test-env-sdist/bin/python -c "import importlib.metadata; print(importlib.metadata.version('django-start-automate'))")
          echo "Installed sdist version: $SDIST_VER"
          if [ "$SDIST_VER" != "${{ env.WHEEL_VER }}" ]; then
            echo "Error: Wheel version (${{ env.WHEEL_VER }}) and sdist version ($SDIST_VER) do not match."
            exit 1
          fi
