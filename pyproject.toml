[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "django-start-automate"
version = "2.0.0a1"
description = "Prepare a new Django project quickly and automatically and more wonderful things that save you time By django start"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Islam Kamel", email = "islam.kamel@agr.svu.edu.eg"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: Django",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
keywords = [
    "django-start", "django start", "djngo start", "django start project",
    "django project", "django automate", "automate django", "start",
    "start automate", "django build", "django tools", "automate start",
    "djangostart", "django_start", "django-start-automate",
    "django_start_automate", "django start automate", "django script",
    "django cli", "django tool", "python cli", "python tool",
    "python tools", "python script"
]
dependencies = [
    "click",
    "packaging>=23.0,<27.0"
]

[project.urls]
Homepage = "https://github.com/islam-kamel/django-start"

[project.scripts]
django-start = "djstartlib.main:main"
django-version = "djstartlib.version:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<10",
]
dev = [
    "pre-commit>=4.0.0,<5",
    "ruff>=0.16.7,<1",
    "mypy>=2.3.1,<3",
    "build>=1.0.0,<2",
    "twine>=7.0.0,<8"
]

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = "django_start.*"
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_unused_ignores = true
warn_return_any = true
implicit_reexport = false
strict_equality = true
extra_checks = true

[[tool.mypy.overrides]]
module = "djstartlib.*"
ignore_errors = true # Deliberate typing debt for relocated legacy implementation scheduled for replacement in Phase 3.

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = true

[tool.setuptools.package-data]
"*" = ["py.typed"]
